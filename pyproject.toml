[project]
name = "silicondreams"
version = "0.9.0.dev4"
description = "Evidence-first semiconductor investment research assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1.5,<2",
    "curl-cffi>=0.13,<1",
    "fastapi>=0.128,<1",
    "jinja2>=3.1,<4",
    "openai>=1.109,<2",
    "pandas>=2.3,<3",
    "pdfplumber>=0.11,<1",
    "pydantic>=2.12,<3",
    "pymupdf>=1.26,<2",
    "pymupdf4llm>=0.0.27,<1",
    "python-dotenv>=1.2,<2",
    "python-multipart>=0.0.22,<1",
    "reportlab>=4.4,<5",
    "sentence-transformers>=5.1,<6",
    "tabulate>=0.9,<1",
    "torch>=2.8,<3",
    "uvicorn[standard]>=0.39,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.13,<1",
]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 60
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["venv", ".venv", "data/chroma_db"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
