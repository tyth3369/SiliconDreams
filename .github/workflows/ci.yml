name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: uv sync --locked
      - name: Audit production dependencies
        run: |
          uv run pip-audit --disable-pip -r requirements.txt --timeout 60 \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815
      - name: Install browser runtime
        run: uv run playwright install --with-deps chromium
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest --cov=src --cov-report=term-missing
      - name: Citation benchmark
        run: uv run python scripts/run_citation_benchmark.py

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose configuration
        run: |
          cp .env.production.example .env.production
          cp .env.caddy.example .env.caddy
          docker compose config --quiet
          SILICONDREAMS_IMAGE=ghcr.io/tyth3369/silicondreams:test \
            docker compose -f compose.yaml -f compose.registry.yaml config --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: silicondreams:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify CPU-only PyTorch runtime
        run: |
          docker run --rm silicondreams:ci python -c \
            "import torch; assert torch.version.cuda is None; print(torch.__version__)"
          docker image inspect silicondreams:ci --format 'image_size_bytes={{.Size}}'
